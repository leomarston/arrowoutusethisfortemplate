name: PhoneDriver
options:
  bundleIdPrefix: com.manycode
  deploymentTarget:
    iOS: "17.0"
targets:
  PhoneDriver:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manycode.phonedriver
        DEVELOPMENT_TEAM: GDU77F3MXL
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Phone Driver"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
  PhoneDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PhoneDriver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manycode.phonedriver.uitests
        DEVELOPMENT_TEAM: GDU77F3MXL
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhoneDriver
schemes:
  PhoneDriver:
    build:
      targets:
        PhoneDriver: all
        PhoneDriverUITests: [test]
    test:
      targets: [PhoneDriverUITests]
